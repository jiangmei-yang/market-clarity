<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>持仓归因与AI复盘</title>
<style>
:root{--bg:#f2f5f8;--ink:#102a43;--text:#334e68;--muted:#526d82;--line:#cbd9e5;--accent:#1769aa;--soft:#e8f3fb;--warn:#fff3cf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.top{display:flex;justify-content:space-between;padding:16px max(20px,calc((100% - 1050px)/2));background:#fff;border-bottom:1px solid var(--line)}.top strong{color:var(--ink)}.top small{display:block;color:var(--muted);font-size:12px}.badge{padding:4px 9px;border-radius:999px;background:var(--warn);color:#795100;font-size:12px}main{width:min(1050px,calc(100% - 36px));margin:30px auto}.intro{display:flex;justify-content:space-between;gap:24px;margin-bottom:20px}.intro h1{margin:0 0 6px;color:var(--ink);font-size:28px}.intro p{margin:0;color:var(--muted)}.note{max-width:300px;padding:10px 12px;background:var(--warn);font-size:12px}.workspace{display:grid;grid-template-columns:340px 1fr;gap:18px}.panel{padding:20px;border:1px solid var(--line);border-radius:12px;background:#fff}h2{margin:0 0 12px;color:var(--ink);font-size:19px}label{display:block;margin:12px 0 7px;color:var(--ink);font-size:13px;font-weight:700}input[type=file]{width:100%;padding:10px;border:1px solid #9eb4c5;border-radius:8px;background:#fff}button.primary{width:100%;margin-top:14px;padding:11px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:700}button.secondary{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--accent)}#status{min-height:25px;margin-top:8px;color:#9b382f;font-size:13px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}.result{min-height:300px;padding:14px;border:1px solid var(--line);border-radius:9px;background:#f8fafc;white-space:pre-wrap;overflow:auto;font-size:13px}.result h3{margin:0 0 10px;color:var(--ink);font-size:16px}.actions{display:flex;gap:8px;margin-top:10px}.disclaimer{margin-top:22px;color:var(--muted);font-size:12px;text-align:center}@media(max-width:760px){.intro,.workspace,.columns{display:block}.note{margin-top:14px;max-width:none}.panel+ .panel{margin-top:14px}}
</style>
</head>
<body>
<header class="top"><span><strong>安心看股 · 持仓归因</strong><small>原始规则结果 + AI复盘报告</small></span><span class="badge">不计算未实现盈亏</span></header>
<main><section class="intro"><div><h1>上传交易记录，找到需要复核的地方</h1><p>选择 CSV 后，系统按 FIFO 匹配买卖；AI 只能改写规则结果，不能补造行情或收益。</p></div><div class="note">默认请求本机 API。部署到其他环境时，请修改脚本中的 <code>API_BASE</code>。</div></section>
<section class="workspace"><div class="panel"><h2>导入交易 CSV</h2><label for="file">选择文件</label><input id="file" type="file" accept=".csv,text/csv"><button id="run" class="primary">运行分析</button><div id="status" role="status" aria-live="polite"></div><p style="color:#526d82;font-size:12px">列格式：日期、代码、名称、方向、价格、数量、金额、费用。文件上限5MB。</p></div><div class="panel"><div class="columns"><section><h3>规则计算结果</h3><div id="raw" class="result">等待上传 CSV…</div></section><section><h3>AI复盘报告</h3><div id="ai" class="result">运行分析后可生成报告。</div><div class="actions"><button id="aiBtn" class="primary" disabled>生成AI报告</button><button id="copy" class="secondary" disabled>复制</button></div></section></div></div></section><p class="disclaimer">本工具仅用于持仓分析和交易复盘参考，不构成投资建议、收益承诺或买卖建议。</p></main>
<script>
const API_BASE="http://127.0.0.1:8000";let csvText="",last=null;const $=s=>document.querySelector(s);const escape=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[c]);async function json(r){const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.detail||"请求失败");return b}
$("#run").onclick=async()=>{const file=$("#file").files[0];if(!file){$("#status").textContent="请先选择CSV文件";return}if(file.size>5*1024*1024){$("#status").textContent="CSV不能超过5MB";return}$("#status").textContent="分析中…";$("#run").disabled=true;try{const fd=new FormData();fd.append("file",file);fd.append("delimiter",",");last=await json(await fetch(`${API_BASE}/trade/upload`,{method:"POST",body:fd}));const a=last.attribution;$("#raw").textContent=`已解析 ${last.record_count} 条记录\n\n总买入：${a.total_buy_amount.toFixed(2)} 元\n总卖出：${a.total_sell_amount.toFixed(2)} 元\n已实现收益：${a.realized_pnl.toFixed(2)} 元\n未平仓标的：${a.active_positions}\n\n风险信号：\n${last.risk_flags.map(x=>`- ${x.label}：${x.detail}`).join("\n")||"- 未触发预设信号"}\n\n${last.report}`;csvText=await file.text();$("#aiBtn").disabled=false;$("#status").textContent=`已完成：${last.filename}`}catch(e){$("#status").textContent=e.message}finally{$("#run").disabled=false}};
$("#aiBtn").onclick=async()=>{if(!last)return;$("#aiBtn").disabled=true;$("#aiBtn").textContent="生成中…";try{const a=last.attribution;const r=await json(await fetch(`${API_BASE}/report/generate_ai`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({total_assets:a.positions.length,active_positions:a.active_positions,realized_pnl:a.realized_pnl,risk_flags:last.risk_flags,suggestion:last.report})}));$("#ai").textContent=r.report;$("#copy").disabled=false;$("#copy").onclick=()=>navigator.clipboard.writeText(r.report)}catch(e){$("#ai").textContent=e.message}finally{$("#aiBtn").disabled=false;$("#aiBtn").textContent="重新生成AI报告"}};
</script>
</body></html>
