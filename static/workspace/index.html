<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个性化工作台｜安心看股</title><link rel="stylesheet" href="/static/workspace/style.css"></head><body>
<header class="top"><a href="/">安心看股</a><div><span>当前工作台</span><strong id="workspaceName">正在载入</strong></div><nav><button id="undo" class="quiet">撤销上次</button><button id="reset" class="quiet">恢复默认</button></nav></header>
<main><section class="heading"><span>自然语言个性化</span><h1>用一句话调整你的工作台</h1><p>系统只生成结构化变更预览。确认前不会改动当前界面、投资规则或交易记录。</p></section>
<section class="command"><label for="command">你希望怎样调整？</label><div><input id="command" value="我主要做 ETF，关注科技和医药，隐藏复杂 K 线，每周提醒一次风险"><button id="preview">生成配置预览</button></div><div class="examples"><button>把财报放到最上面，隐藏所有技术指标</button><button>只显示简洁结论</button><button>给我一个适合新手的界面</button><button>给我一个适合晚上看财报的主题</button></div><p id="message" role="status"></p></section>
<section class="summary"><div><span>当前主题</span><strong id="theme">—</strong></div><div><span>信息密度</span><strong id="density">—</strong></div><div><span>解释难度</span><strong id="explanation">—</strong></div><div><span>提醒频率</span><strong id="frequency">—</strong></div></section>
<section><header class="section-title"><div><span>当前模块</span><h2>工作台内容和顺序</h2></div><small>模块修改同样会写入审计记录</small></header><div id="modules" class="modules"></div></section>
</main>
<dialog id="previewDialog"><form method="dialog"><header><div><span>配置变更预览</span><h2>确认后才会应用</h2></div><button value="close" aria-label="关闭">×</button></header><div class="dialog-body"><section><h3>即将修改</h3><div id="changes"></div></section><section id="warningsBlock" hidden><h3>需要注意</h3><div id="warnings"></div></section><section id="questionsBlock" hidden><h3>需要确认</h3><div id="questions"></div></section><aside><strong>不会修改</strong><span>持仓数据 · 交易记录 · 投资规则 · 账户权限 · API Key</span></aside></div><footer><button id="cancel" value="close" class="quiet">取消</button><button id="confirm" value="close">确认应用</button></footer></form></dialog>
<footer class="disclaimer">所有界面配置变更都需要确认，并支持撤销。本工具用于界面个性化、投资信息整理和风险检查，不构成任何投资建议、收益承诺或买卖建议。</footer>
<script src="/static/workspace/script.js"></script></body></html>
